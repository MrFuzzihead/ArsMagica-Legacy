name: Game tests

# The reusable GTNH build workflow runs `check`, which now includes the JUnit suite, Spotless/Checkstyle, the JaCoCo
# floor and the game-test compilation. This workflow adds the part `check` cannot do on its own: a real dedicated
# server, real Forge startup and a real client (under Xvfb). `./gradlew gameTestServer` writes eula.txt/server.properties
# itself, and both game runs exit with their own result.

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-test:
    name: Unit tests + server and client game tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Gradle daemon follows gradle/gradle-daemon-jvm.properties (Java 25). Install Java 8 too: the test suite
      # runs on a Java 8 toolchain, matching the mod's bytecode target and Mockito 4.x. Zulu keeps the Java 8 download
      # off the Adoptium GitHub asset that has intermittently returned a corrupt archive.
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the unit tests and the in-game server tests
        run: ./gradlew test gameTestServer --stacktrace

      - name: Check the server game-test marker
        # The test mod prints ARSMAGICA_GAMETEST_OK only after every assertion has passed and the game has to shut
        # down cleanly; a crash mid-run therefore fails here instead of silently passing.
        # Grep every log: FML routes mod stdout to fml-server-latest.log, not vanilla latest.log, and also writes
        # fml-junk-earlystartup.log, which sorts before latest.log.
        run: |
          ls -l run/server/logs/ || true
          test -n "$(ls run/server/logs/*.log 2>/dev/null)" || { echo "no server log was written"; exit 1; }
          grep -hE "\[ARSMAGICA-GAMETEST\] [0-9]+/[0-9]+ checks passed" run/server/logs/*.log || true
          grep -hq "ARSMAGICA_GAMETEST_OK" run/server/logs/*.log
          ! grep -hq "ARSMAGICA_GAMETEST_FAILED" run/server/logs/*.log
          grep -hq "mixins.arsmagica2.early.json" run/server/logs/*.log
          ! grep -hqE "MixinApplyError|InvalidInjectionException|MixinTransformerError" run/server/logs/*.log
          ! grep -hE "\[[^]]*/ERROR\].*\[ArsMagica2" run/server/logs/*.log

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arsmagica-game-test-log
          path: run/server/logs/
          if-no-files-found: warn

      # The client half covers the client proxy, the key bindings, the creative tabs and localisation. A headless
      # Ubuntu runner needs a virtual display and a software GL stack. LWJGL2's XRandR helper shells out to the
      # `xrandr` binary; without it `getScreenNames()` is empty and LinuxDisplay throws ArrayIndexOutOfBoundsException.
      # `xauth` is needed by xvfb-run.
      - name: Install a virtual display for the client test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth x11-xserver-utils x11-utils \
            libgl1-mesa-dri libglx-mesa0 libglu1-mesa mesa-utils \
            libxcursor1 libxrandr2 libxi6 libxxf86vm1 libxinerama1

      - name: Check the virtual display
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24 +extension RANDR +extension GLX" sh -c 'xrandr --query && glxinfo | head -20'

      - name: Run the client game tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1024x768x24 +extension RANDR +extension GLX" ./gradlew gameTestClient --stacktrace

      - name: Check the client-test marker
        run: |
          ls -l run/client/logs/ || true
          grep -hE "\[ARSMAGICA-CLIENTTEST\] [0-9]+/[0-9]+ checks passed" run/client/logs/*.log || true
          grep -hq "ARSMAGICA_CLIENTTEST_OK" run/client/logs/*.log
          ! grep -hq "ARSMAGICA_CLIENTTEST_FAILED" run/client/logs/*.log
          grep -hq "mixins.arsmagica2.early.json" run/client/logs/*.log
          ! grep -hqE "MixinApplyError|InvalidInjectionException|MixinTransformerError" run/client/logs/*.log
          ! grep -hE "\[[^]]*/ERROR\].*\[ArsMagica2" run/client/logs/*.log

      - name: Upload the client log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arsmagica-client-test-log
          path: run/client/logs/
          if-no-files-found: warn

      - name: Upload the unit-test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arsmagica-unit-tests
          path: build/reports/tests/test/
          if-no-files-found: warn

      # Blocking changed-line gate. The current branch baseline is 40%; 35% leaves a small safety margin while
      # still rejecting PRs that add mostly-uncovered production code.
      - name: Coverage on changed lines
        if: github.event_name == 'pull_request'
        run: |
          python3 -m pip install --quiet diff-cover
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          diff-cover build/reports/jacoco/test/jacocoTestReport.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=35

      - name: Publish the check summary
        if: always()
        run: |
          {
            echo "## Game tests"
            grep -hE "checks passed" run/server/logs/*.log run/client/logs/*.log 2>/dev/null || echo "no check marker found"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arsmagica-coverage
          path: build/reports/jacoco/
          if-no-files-found: warn
